<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunny Beauty Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<!-- Nếu 3 dòng script trên báo lỗi 404 trong Console (F12) khi mở trang, nghĩa là phiên bản 12.19.0
     đã cũ. Vào https://firebase.google.com/docs/web/setup , lấy số phiên bản mới nhất và thay
     "12.19.0" ở cả 3 dòng trên bằng số phiên bản đó. -->
<style>
:root{
  /* Pastel trầm, tinh chỉnh cho cảm giác sang trọng: ivory / nude / sage trầm / dusty blue / antique gold */
  --bg:#F7F3EA; --surface:#FFFFFF; --surface-2:#EFE7D8; --border:#E2D6C0;
  --text:#2C2822; --text-muted:#837A6A; --text-faint:#B3A78F;
  --accent:#6C8973; --accent-strong:#4A6455; --accent-soft:#E7EEE8; --accent-soft-2:#D6E2D9;
  --gold:#AE8A56; --gold-soft:#EFE3CA;
  --blue:#7E9BAE; --blue-strong:#48697D; --blue-soft:#E4EBF0;
  --danger:#B27E6C; --danger-soft:#F1E1D8;
  --warning:#B08E51; --warning-soft:#F0E3C7;
  --success:#6C8973; --success-soft:#E4ECE6;
  --neutral-soft:#ECE3D2;
  --shadow-sm:0 1px 2px rgba(40,34,20,.05);
  --shadow-md:0 16px 40px -18px rgba(40,34,20,.28);
  --radius:14px; --radius-sm:9px;
  --font-display:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1C1813; --surface:#252019; --surface-2:#2E2820; --border:#453D2F;
    --text:#EFE6D6; --text-muted:#B3A488; --text-faint:#786B54;
    --accent:#93B29E; --accent-strong:#B4CFBE; --accent-soft:#2A362E; --accent-soft-2:#334438;
    --gold:#D3B57F; --gold-soft:#382E1C;
    --blue:#9AB4C4; --blue-strong:#C0D6E1; --blue-soft:#25313A;
    --danger:#CDA290; --danger-soft:#392A22;
    --warning:#D0B077; --warning-soft:#382E1B;
    --success:#93B29E; --success-soft:#25322A;
    --neutral-soft:#2E2820;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 16px 40px -18px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1813; --surface:#252019; --surface-2:#2E2820; --border:#453D2F;
  --text:#EFE6D6; --text-muted:#B3A488; --text-faint:#786B54;
  --accent:#93B29E; --accent-strong:#B4CFBE; --accent-soft:#2A362E; --accent-soft-2:#334438;
  --gold:#D3B57F; --gold-soft:#382E1C;
  --blue:#9AB4C4; --blue-strong:#C0D6E1; --blue-soft:#25313A;
  --danger:#CDA290; --danger-soft:#392A22;
  --warning:#D0B077; --warning-soft:#382E1B;
  --success:#93B29E; --success-soft:#25322A;
  --neutral-soft:#2E2820;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 16px 40px -18px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Be Vietnam Pro",-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;}
h1,h2,h3,h4{font-weight:700; margin:0; text-wrap:balance; letter-spacing:-0.01em;}
.font-display{font-family:var(--font-display); font-weight:600; letter-spacing:-0.01em;}
button{font-family:inherit;}
a{color:var(--accent);}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
svg.icon{width:18px;height:18px;flex:none;display:block;}

/* ---------- Login ---------- */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:
  radial-gradient(1100px 640px at 50% -15%, var(--accent-soft), transparent 62%), var(--bg);}
.login-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-md);padding:38px 34px;position:relative;overflow:hidden;}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold));}
.login-brand{display:flex;align-items:center;gap:13px;margin-bottom:6px;}
.login-brand .mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(160deg,var(--accent),var(--accent-strong));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:none;box-shadow:var(--shadow-sm);}
.login-brand .name{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.01em;}
.login-brand .tag{color:var(--text-muted);font-size:12.5px;}
.auth-tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px;margin:18px 0 6px;}
.auth-tab{flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:13px;font-weight:700;color:var(--text-muted);cursor:pointer;}
.auth-tab.active{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow-sm);}
.login-sub{color:var(--text-muted);margin:18px 0 6px;font-size:13.5px;}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px;}
.staff-pick{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface-2);cursor:pointer;transition:.15s;}
.staff-pick:hover{border-color:var(--accent);background:var(--accent-soft);}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none;}
.avatar.sm{width:30px;height:30px;font-size:12.5px;}
.staff-pick .nm{font-size:12.5px;font-weight:600;text-align:center;line-height:1.25;}
.staff-pick .rl{font-size:10.5px;color:var(--text-muted);}
.pin-wrap{display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:16px;}
.pin-dots{display:flex;gap:14px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-dot.shake{animation:shake .38s;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:12px;}
.pinkey{height:56px;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);font-size:19px;font-weight:600;cursor:pointer;color:var(--text);}
.pinkey:hover{background:var(--accent-soft);border-color:var(--accent);}
.pinkey.wide{grid-column:span 1;font-size:12.5px;color:var(--text-muted);}
.back-link{display:flex;align-items:center;gap:6px;color:var(--text-muted);font-size:13px;cursor:pointer;margin-bottom:4px;}
.back-link:hover{color:var(--text);}
.onboard-form{display:flex;flex-direction:column;gap:12px;margin-top:14px;}

/* ---------- Shell ---------- */
#app{display:none;min-height:100vh;}
#app.on{display:flex;}
#sidebar{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(160deg,var(--accent),var(--accent-strong));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none;}
.brand .name{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.01em;}
.brand .tag{font-size:10.5px;color:var(--text-muted);}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--text-muted);cursor:pointer;font-size:13.5px;font-weight:500;}
.nav-item svg{color:var(--text-faint);}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-strong);font-weight:700;}
.nav-item.active svg{color:var(--accent-strong);}
.side-user{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;display:flex;align-items:center;gap:9px;}
.side-user .who{flex:1;min-width:0;}
.side-user .who .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-user .who .r{font-size:11px;color:var(--text-muted);}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-muted);flex:none;}
.iconbtn:hover{color:var(--danger);border-color:var(--danger);}

#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:16px 26px;background:color-mix(in srgb, var(--bg) 85%, transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);}
#topbar .title{font-size:19px;font-weight:800;}
#topbar .date{font-size:12.5px;color:var(--text-muted);}
#app-main{padding:22px 26px 60px;max-width:1320px;width:100%;margin:0 auto;}

/* ---------- Generic components ---------- */
.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.gap-6{gap:6px;}.gap-8{gap:8px;}.gap-10{gap:10px;}.gap-14{gap:14px;}
.wrap{flex-wrap:wrap;}
.mb-14{margin-bottom:14px;}.mb-18{margin-bottom:18px;}
.muted{color:var(--text-muted);}
.faint{color:var(--text-faint);}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid transparent;white-space:nowrap;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-strong);}
.btn-ghost{background:var(--surface-2);color:var(--text);border-color:var(--border);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-strong);}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-danger:hover{opacity:.85;}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.icon-only{width:32px;height:32px;padding:0;justify-content:center;border-radius:8px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
@media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.stat .lbl{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
.stat .val{font-size:23px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;}
.stat .sub{font-size:12px;margin-top:4px;color:var(--text-muted);}
.stat .sub.up{color:var(--success);}
.stat .sub.down{color:var(--danger);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 12px;}
.section-title h3{font-size:15px;}
.section-title:first-child{margin-top:0;}

table{width:100%;border-collapse:collapse;font-size:13.2px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
th{text-align:left;padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:700;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
.clickable{cursor:pointer;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.badge-neutral{background:var(--neutral-soft);color:var(--text-muted);}
.badge-accent{background:var(--accent-soft);color:var(--accent-strong);}
.badge-success{background:var(--success-soft);color:var(--success);}
.badge-warning{background:var(--warning-soft);color:var(--warning);}
.badge-danger{background:var(--danger-soft);color:var(--danger);}
.badge-gold{background:var(--gold-soft);color:var(--gold);}
.badge-blue{background:var(--blue-soft);color:var(--blue-strong);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:600;color:var(--text-muted);}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],input[type=tel],select,textarea{
  font-family:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);width:100%;
}
textarea{resize:vertical;min-height:60px;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:560px){.form-grid{grid-template-columns:1fr;}}
.hint{font-size:11.5px;color:var(--text-faint);}

.searchbox{position:relative;width:260px;}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-faint);}
.searchbox input{padding-left:32px;}
@media(max-width:640px){.searchbox{width:100%;}}

.empty{padding:56px 20px;text-align:center;color:var(--text-muted);}
.empty svg{width:38px;height:38px;color:var(--text-faint);margin-bottom:10px;}
.empty .t{font-weight:700;color:var(--text);margin-bottom:4px;}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.tab{padding:9px 4px;margin-right:18px;font-size:13.5px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.active{color:var(--accent-strong);border-color:var(--accent);}

/* ---------- Modal ---------- */
#modal-root{position:fixed;inset:0;z-index:50;display:none;}
#modal-root.on{display:block;}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,20,16,.45);}
.modal{position:relative;max-width:620px;margin:5vh auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow-md);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;}
.modal.wide{max-width:820px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:16px;}
.modal-body{padding:18px 20px;overflow-y:auto;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
@media(max-width:640px){.modal{margin:0;max-height:100vh;height:100vh;border-radius:0;width:100%;}}

/* ---------- Toast ---------- */
#toast-root{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text);color:var(--bg);padding:11px 16px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow-md);animation:toastin .18s ease-out;}
.toast.err{background:var(--danger);color:#fff;}
.toast.ok{background:var(--success);color:#fff;}
@keyframes toastin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ---------- misc ---------- */
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;}
.bars .bar{flex:1;background:var(--accent-soft);border-radius:5px 5px 0 0;position:relative;min-height:2px;}
.bars .bar .fill{position:absolute;bottom:0;left:0;right:0;background:var(--accent);border-radius:5px 5px 0 0;}
.bars .lab{font-size:10px;color:var(--text-faint);text-align:center;margin-top:6px;}
.progress{height:6px;border-radius:99px;background:var(--neutral-soft);overflow:hidden;}
.progress .fill{height:100%;background:var(--accent);}
.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
@media(max-width:980px){.two-col{grid-template-columns:1fr;}}
hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}

@media(max-width:760px){
  #app.on{flex-direction:column;}
  #sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;overflow-x:auto;padding:10px 12px;}
  .brand{padding:0 10px 0 0;}
  .nav{flex-direction:row;flex:none;}
  .nav-item span{display:none;}
  .side-user{display:none;}
  .brand .name,.brand .tag{display:none;}
  .brand{padding:0 6px 0 0;}
  .stat-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>


<div id="login-screen"></div>

<div id="app">
  <div id="sidebar"></div>
  <div id="main">
    <div id="topbar"></div>
    <div id="app-main"></div>
  </div>
</div>

<div id="modal-root"><div class="modal-backdrop" onclick="closeModal()"></div><div id="modal-inner"></div></div>
<div id="toast-root"></div>

<script>
/* =====================================================================
   CẤU HÌNH FIREBASE — BẮT BUỘC PHẢI ĐIỀN TRƯỚC KHI DÙNG
   Đây là nơi kết nối tới database Firestore dùng chung của BẠN. Xem
   hướng dẫn tạo project Firebase miễn phí kèm theo (Claude đã gửi).
   Sau khi tạo project trên https://console.firebase.google.com , vào
   Project settings > General > "Your apps" > Web app, copy đoạn
   firebaseConfig và dán đè vào object bên dưới.
   ===================================================================== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID",
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";

/* ================= ICONS ================= */
const ICONS = {
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/>',
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.3 2.5-5.5 5.5-5.5s5.5 2.2 5.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M15.2 14.7c2.6.3 4.3 2.2 4.3 5.3"/>',
 user:'<circle cx="12" cy="8" r="3.5"/><path d="M4.5 20.5c0-4 3.4-6.8 7.5-6.8s7.5 2.8 7.5 6.8"/>',
 file:'<path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v5h5"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
 box:'<path d="M3 8l9-5 9 5-9 5-9-5Z"/><path d="M3 8v9l9 5 9-5V8"/><line x1="12" y1="13" x2="12" y2="22"/>',

/* ================= HELPERS ================= */
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nextCode(prefix, arr){
  let n=(arr||[]).length+1;
  let code=prefix+String(n).padStart(4,'0');
  const used=new Set((arr||[]).map(x=>x.code));
  while(used.has(code)){ n++; code=prefix+String(n).padStart(4,'0'); }
  return code;
}
function fmtVND(n){ n=Number(n)||0; return n.toLocaleString('vi-VN')+' đ'; }
function fmtNum(n){ return (Number(n)||0).toLocaleString('vi-VN'); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('vi-VN'); }
function fmtDateTime(d){ if(!d) return '—'; const dt=new Date(d); if(isNaN(dt)) return d; return dt.toLocaleDateString('vi-VN')+' '+dt.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowLocalInput(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase().slice(0,2); }
function byId(arr,id){ return (arr||[]).find(x=>x.id===id); }
function toast(msg, type){
  const root=document.getElementById('toast-root');
  const el=document.createElement('div');
  el.className='toast'+(type?' '+type:'');
  el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(),250); }, 2600);
}

/* Focus-preserving repaint */
function paint(){
  if(!state.user){ paintLogin(); return; }
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').classList.add('on');
  paintShell();
  repaintMain();
}
function repaintMain(){
  const ae=document.activeElement;
  const activeId = ae && ae.id ? ae.id : null;
  const selStart = ae && 'selectionStart' in ae ? ae.selectionStart : null;
  const selEnd = ae && 'selectionEnd' in ae ? ae.selectionEnd : null;
  document.getElementById('app-main').innerHTML = renderView();
  bindView();
  if(activeId){
    const el=document.getElementById(activeId);
    if(el){ el.focus(); if(selStart!=null && el.setSelectionRange){ try{el.setSelectionRange(selStart,selEnd);}catch(e){} } }
  }
}

function switchAuthTab(tab){ state.authTab=tab; state.authError=''; paintLogin(); }
async function doLogin(){
  const username=document.getElementById('li-username').value.trim().toLowerCase();
  const password=document.getElementById('li-password').value;
  const s = state.staff.find(x=>String(x.username||'').toLowerCase()===username);
  if(!s || String(s.password||'')!==password){ state.authError='Sai tên đăng nhập hoặc mật khẩu.'; paintLogin(); return; }
  if(s.active===false){ state.authError='Tài khoản này đã ngừng hoạt động.'; paintLogin(); return; }
  state.user=s; state.view='dashboard'; state.authError='';
  paint();
  toast('Xin chào, '+s.name, 'ok');
}
async function doRegister(isFirst){
  const name=document.getElementById('rg-name').value.trim();
  const phone=document.getElementById('rg-phone').value.trim();
  const username=document.getElementById('rg-username').value.trim().toLowerCase();
  const password=document.getElementById('rg-password').value;
  const password2=document.getElementById('rg-password2').value;
  const role = isFirst ? 'admin' : document.getElementById('rg-role').value;
  if(!name) return toast('Nhập họ tên','err');
  if(!/^[a-z0-9_.]{3,20}$/.test(username)) return toast('Tên đăng nhập 3-20 ký tự: chữ thường, số, dấu chấm hoặc gạch dưới','err');
  if(state.staff.some(x=>String(x.username||'').toLowerCase()===username)) return toast('Tên đăng nhập đã tồn tại','err');
  if(password.length<6) return toast('Mật khẩu tối thiểu 6 ký tự','err');
  if(password!==password2) return toast('Mật khẩu xác nhận không khớp','err');
  const data={name, code:nextCode('NV', state.staff), phone, username, password, role, commission_rate:0, active:true, created_at:new Date().toISOString()};
  try{
    const ref = await db.collection('staff').add(data);
    state.user={id:ref.id, ...data};
    state.authTab='login'; state.authError='';
    toast(isFirst? 'Đã tạo tài khoản Quản lý' : 'Đăng ký thành công','ok');
    paint();
  }catch(e){ toast('Không thể tạo tài khoản: '+e.message,'err'); }
}

/* ================= DASHBOARD ================= */
function rangeDates(range){
  const now=new Date(); let start,end=new Date(now);
  if(range==='today'){ start=new Date(now); }
  else if(range==='week'){ start=new Date(now); start.setDate(start.getDate()-start.getDay()); }
  else if(range==='month'){ start=new Date(now.getFullYear(), now.getMonth(), 1); }
  else { start=new Date(now.getFullYear(),0,1); }
  start.setHours(0,0,0,0); end.setHours(23,59,59,999);
  return {start, end};
}
function invDate(inv){ return new Date(inv.date || inv.created_at); }
function renderDashboard(){
  const {start,end} = rangeDates(state.dash.range);
  const inRange = d => { const t=new Date(d).getTime(); return t>=start.getTime() && t<=end.getTime(); };
  const doneInv = state.invoices.filter(i=>i.status==='done' && inRange(i.date||i.created_at));
  const revenue = doneInv.reduce((s,i)=>s+(i.total||0),0);
  const cogs = doneInv.reduce((s,i)=>s+(i.lines||[]).reduce((a,l)=>a+(l.kind==='item'?(l.cost_snapshot||0)*(l.qty||0):0),0),0);
  const gross = revenue-cogs;
  const margin = revenue>0? (gross/revenue*100):0;
  const allDone = state.invoices.filter(i=>i.status==='done');
  const receivable = allDone.reduce((s,i)=>s+Math.max(0,(i.total||0)-(i.paid_total||0)),0);
  const overdueDays = getSettings().overdue_days||30;
  const overdueCount = allDone.filter(i=>{
    const due=(i.total||0)-(i.paid_total||0);
    if(due<=0) return false;
    const days=(Date.now()-new Date(i.date||i.created_at).getTime())/86400000;
    return days>overdueDays;
  }).length;
  const deposit = state.invoices.filter(i=>i.status==='draft'||i.status==='unpaid').reduce((s,i)=>s+(i.paid_total||0),0);
  const apptsInRange = state.appointments.filter(a=>inRange(a.datetime));
  const cancelled = apptsInRange.filter(a=>a.status==='cancelled'||a.status==='noshow').length;
  const apptRate = apptsInRange.length? Math.round((apptsInRange.filter(a=>a.status==='done').length/apptsInRange.length)*100):0;
  const lowStock = state.items.filter(it=>it.active!==false && (it.stock_qty||0)<=(it.min_stock||0) && (it.min_stock||0)>0);
  const soon = new Date(); soon.setDate(soon.getDate()+30);
  const expiring = state.items.filter(it=>it.expiry_date && new Date(it.expiry_date)<=soon && new Date(it.expiry_date)>=new Date());
  const invValue = state.items.reduce((s,it)=>s+(it.stock_qty||0)*(it.cost_avg||0),0);

  // top services by revenue in range
  const svcMap={};
  doneInv.forEach(i=>(i.lines||[]).forEach(l=>{ if(l.kind==='service'){ svcMap[l.name]=(svcMap[l.name]||0)+(l.qty*l.price-(l.discount||0)); } }));
  const topSvc = Object.entries(svcMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxSvc = Math.max(1, ...topSvc.map(x=>x[1]));

  // daily revenue bars (last up to 14 buckets within range or last 7 days)
  const days=[]; let cursor=new Date(start);
  while(cursor<=end && days.length<31){ days.push(new Date(cursor)); cursor.setDate(cursor.getDate()+1); }
  const showDays = days.length<=31? days : days.slice(-14);
  const dayRev = showDays.map(d=>{
    const key=d.toDateString();
    const sum = doneInv.filter(i=>new Date(i.date||i.created_at).toDateString()===key).reduce((s,i)=>s+(i.total||0),0);
    return {d, sum};
  });
  const maxDay = Math.max(1, ...dayRev.map(x=>x.sum));

  if(state.user.role==='nhanvien'){
    const mine = doneInv.filter(i=> (i.staff_id===state.user.id) || (i.lines||[]).some(l=>l.staff_id===state.user.id) );
    const commission = mine.reduce((s,i)=>{
      const rate=(byId(state.staff,state.user.id)||{}).commission_rate||0;
      const svcSum=(i.lines||[]).filter(l=>l.kind==='service' && (l.staff_id||i.staff_id)===state.user.id).reduce((a,l)=>a+(l.qty*l.price-(l.discount||0)),0);
      return s+svcSum*rate/100;
    },0);
    const myAppts = state.appointments.filter(a=>a.staff_id===state.user.id && new Date(a.datetime)>=new Date()).sort((a,b)=>new Date(a.datetime)-new Date(b.datetime)).slice(0,8);
    return `
      ${rangePicker()}
      <div class="stat-grid mb-18">
        <div class="stat"><div class="lbl">Hoa hồng ước tính</div><div class="val">${fmtVND(commission)}</div><div class="sub">${rangeLabel()}</div></div>
        <div class="stat"><div class="lbl">Hóa đơn phụ trách</div><div class="val">${mine.length}</div></div>
        <div class="stat"><div class="lbl">Lịch hẹn sắp tới</div><div class="val">${state.appointments.filter(a=>a.staff_id===state.user.id && new Date(a.datetime)>=new Date() && a.status!=='cancelled').length}</div></div>
        <div class="stat"><div class="lbl">Tỷ lệ hoàn thành lịch</div><div class="val">${apptRate}%</div></div>
      </div>
      <div class="section-title"><h3>Lịch hẹn sắp tới của bạn</h3></div>
      ${myAppts.length? apptTable(myAppts,true) : emptyState('calendar','Chưa có lịch hẹn sắp tới')}
    `;
  }

  return `
    ${rangePicker()}
    <div class="stat-grid mb-18">
      <div class="stat"><div class="lbl">Doanh thu</div><div class="val">${fmtVND(revenue)}</div><div class="sub">${rangeLabel()} · ${doneInv.length} hóa đơn</div></div>
      <div class="stat"><div class="lbl">Lợi nhuận gộp</div><div class="val">${fmtVND(gross)}</div><div class="sub">Biên LN ${margin.toFixed(1)}%</div></div>
      <div class="stat"><div class="lbl">Công nợ khách hàng</div><div class="val">${fmtVND(receivable)}</div><div class="sub">Cần thu</div></div>
      <div class="stat"><div class="lbl">Tiền đặt cọc chưa ghi nhận DT</div><div class="val">${fmtVND(deposit)}</div></div>
    </div>
    <div class="two-col">
      <div class="card card-pad">
        <div class="row between mb-14"><h3 style="font-size:14px;">Doanh thu theo ngày</h3><span class="muted" style="font-size:11.5px;">${rangeLabel()}</span></div>
        ${dayRev.length? `<div class="bars">${dayRev.map(x=>`<div class="bar" title="${fmtDate(x.d)}: ${fmtVND(x.sum)}"><div class="fill" style="height:${Math.max(2,x.sum/maxDay*100)}%"></div></div>`).join('')}</div>
        <div class="row" style="margin-top:6px;">${dayRev.map(x=>`<div class="lab" style="flex:1;">${x.d.getDate()}</div>`).join('')}</div>`
        : emptyState('chart','Chưa có dữ liệu doanh thu')}
      </div>
      <div class="card card-pad">
        <h3 style="font-size:14px;margin-bottom:14px;">Dịch vụ bán chạy</h3>
        ${topSvc.length? topSvc.map(([name,val])=>`
          <div style="margin-bottom:10px;">
            <div class="row between" style="font-size:12.5px;margin-bottom:4px;"><span>${esc(name)}</span><span class="mono muted">${fmtVND(val)}</span></div>
            <div class="progress"><div class="fill" style="width:${val/maxSvc*100}%"></div></div>
          </div>`).join('') : emptyState('sparkle','Chưa có dữ liệu dịch vụ')}
      </div>
    </div>
    <div class="section-title"><h3>Cảnh báo vận hành</h3></div>
    <div class="two-col">
      <div class="card card-pad">
        <div class="row gap-8 mb-14"><span class="badge badge-danger">${lowStock.length}</span><b style="font-size:13.5px;">Hàng tồn thấp</b></div>
        ${lowStock.length? lowStock.slice(0,6).map(it=>`<div class="row between" style="padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);"><span>${esc(it.name)}</span><span class="mono">${fmtNum(it.stock_qty)} / tối thiểu ${fmtNum(it.min_stock)}</span></div>`).join('') : `<div class="muted" style="font-size:13px;">Không có cảnh báo.</div>`}
      </div>
      <div class="card card-pad">
        <div class="row gap-8 mb-14"><span class="badge badge-warning">${expiring.length}</span><b style="font-size:13.5px;">Sắp hết hạn (30 ngày)</b></div>
        ${expiring.length? expiring.slice(0,6).map(it=>`<div class="row between" style="padding:6px 0;font-size:13px;border-bottom:1px solid var(--border);"><span>${esc(it.name)}</span><span class="mono">${fmtDate(it.expiry_date)}</span></div>`).join('') : `<div class="muted" style="font-size:13px;">Không có cảnh báo.</div>`}
      </div>
    </div>
    <div class="stat-grid" style="margin-top:18px;">
      <div class="stat"><div class="lbl">Giá trị tồn kho</div><div class="val">${fmtVND(invValue)}</div></div>
      <div class="stat"><div class="lbl">Lịch hẹn hủy/không đến</div><div class="val">${cancelled}</div><div class="sub">${rangeLabel()}</div></div>
      <div class="stat"><div class="lbl">Giá trị TB/hóa đơn</div><div class="val">${fmtVND(doneInv.length? revenue/doneInv.length:0)}</div></div>
      <div class="stat"><div class="lbl">Khách nợ quá hạn (&gt;${overdueDays} ngày)</div><div class="val">${overdueCount}</div></div>
    </div>
  `;
}

function renderAppointments(){
  const f = state.filters.appt || (state.filters.appt={date:todayISO(), status:'', q:''});
  let list = state.appointments.slice();
  if(state.user.role==='nhanvien') list = list.filter(a=>a.staff_id===state.user.id);
  if(f.date) list = list.filter(a=> (a.datetime||'').slice(0,10)===f.date);
  if(f.status) list = list.filter(a=>a.status===f.status);
  if(f.q){ const q=f.q.toLowerCase(); list=list.filter(a=>(a.customer_name||'').toLowerCase().includes(q)); }
  list.sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));
  return `
    <div class="row wrap gap-10 mb-18 between">
      <div class="row wrap gap-10">
        <div class="field" style="width:170px;"><input type="date" id="f-appt-date" value="${f.date}"></div>
        <select id="f-appt-status" style="width:170px;">
          <option value="">Tất cả trạng thái</option>
          ${statusOptions('appt', f.status)}
        </select>
        <div class="searchbox">${icon('search')}<input id="f-appt-q" type="text" placeholder="Tìm khách hàng..." value="${esc(f.q)}"></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="clearApptDate()">Xem tất cả sắp tới</button>
    </div>
    ${list.length? apptTable(list, state.user.role==='nhanvien') : emptyState('calendar','Không có lịch hẹn phù hợp')}
  `;
}
function clearApptDate(){ state.filters.appt.date=''; repaintMain(); }
function statusOptions(kind, val){
  const maps = {
    appt: {pending:'Chờ xác nhận',confirmed:'Đã xác nhận',done:'Hoàn thành',cancelled:'Đã hủy',noshow:'Không đến'},
    invoice: {draft:'Nháp',unpaid:'Chưa hoàn thành',done:'Hoàn thành',cancelled:'Đã hủy'},
  };
  return Object.entries(maps[kind]).map(([k,v])=>`<option value="${k}" ${val===k?'selected':''}>${v}</option>`).join('');
}
const APPT_BADGE = {pending:'blue', confirmed:'accent', done:'success', cancelled:'danger', noshow:'warning'};
const APPT_LABEL = {pending:'Chờ xác nhận', confirmed:'Đã xác nhận', done:'Hoàn thành', cancelled:'Đã hủy', noshow:'Không đến'};
function apptTable(list, readonly){

  ${list.map(a=>`<tr>
    <td class="mono">${fmtDateTime(a.datetime)}</td>

    <td>${esc(a.service_name)}</td>

      <div class="row gap-6">
      ${readonly?'':`
        ${a.status!=='done'?`<button class="btn btn-sm btn-ghost" onclick="setApptStatus('${a.id}','done')">Hoàn thành</button>`:''}

async function saveAppt(id){
  const customer_id = document.getElementById('ap-customer').value;
  const service_id = document.getElementById('ap-service').value;
  const staff_id = document.getElementById('ap-staff').value;
  const datetime = document.getElementById('ap-datetime').value;
  const status = document.getElementById('ap-status').value;
  const note = document.getElementById('ap-note').value.trim();
  if(!customer_id || !service_id || !staff_id || !datetime) return toast('Vui lòng điền đủ thông tin','err');
  const c=byId(state.customers,customer_id), s=byId(state.services,service_id), st=byId(state.staff,staff_id);
  const data={customer_id, customer_name:c.name, customer_phone:c.phone||'', service_id, service_name:s.name, staff_id, staff_name:st.name, datetime, status, note, updated_at:new Date().toISOString()};
  try{
    if(id) await db.doc('appointments/'+id).update(data);
    else { data.created_at=new Date().toISOString(); data.created_by=state.user.id; await db.collection('appointments').add(data); }

  }catch(e){ toast(e.message,'err'); }
}

      </div>
      <div class="hint" style="margin-top:8px;">Giá vốn trung bình sẽ tự động cập nhật theo phương pháp bình quân gia quyền.</div>

  `);

async function saveStockIn(){
  const itemId=document.getElementById('si-item').value;
  const qty=Number(document.getElementById('si-qty').value);
  const cost=Number(document.getElementById('si-cost').value);
  const date=document.getElementById('si-date').value;
  const supplier=document.getElementById('si-supplier').value.trim();
  if(!itemId || !qty || qty<=0) return toast('Nhập số lượng hợp lệ','err');
  const it=byId(state.items,itemId);
  const oldStock=it.stock_qty||0, oldCost=it.cost_avg||0;
  const newStock=oldStock+qty;
  const newCost = newStock>0 ? ((oldStock*oldCost)+(qty*cost))/newStock : cost;
  try{
    await db.doc('items/'+itemId).update({stock_qty:newStock, cost_avg:newCost, updated_at:new Date().toISOString()});
    await db.collection('stockmoves').add({item_id:itemId, item_name:it.name, type:'nhap', qty, unit_cost:cost, note:supplier?('NCC: '+supplier):'', date, created_by:state.user.id, created_at:new Date().toISOString()});
    toast('Đã nhập kho','ok'); closeModal();
  }catch(e){ toast(e.message,'err'); }
}

async function saveAdjust(){
  const itemId=document.getElementById('aj-item').value;
  const type=document.getElementById('aj-type').value;
  const qty=Number(document.getElementById('aj-qty').value);
  const reason=document.getElementById('aj-reason').value.trim();
  if(!itemId || !qty || qty<=0) return toast('Nhập số lượng hợp lệ','err');
  if(!reason) return toast('Nhập lý do điều chỉnh','err');
  const it=byId(state.items,itemId);
  const delta = type==='dieu_chinh_tang'? qty : -qty;
  const newStock = Math.max(0,(it.stock_qty||0)+delta);
  try{
    await db.doc('items/'+itemId).update({stock_qty:newStock, updated_at:new Date().toISOString()});
    await db.collection('stockmoves').add({item_id:itemId, item_name:it.name, type, qty:delta, note:reason, date:todayISO(), created_by:state.user.id, created_at:new Date().toISOString()});
    toast('Đã điều chỉnh tồn kho','ok'); closeModal();
  }catch(e){ toast(e.message,'err'); }
}

  let promoDiscount = 0;
  if(draftInvoice.promo_id){
    const p = byId(state.promotions, draftInvoice.promo_id);
    if(p){
      const base = subtotal - lineDiscount;
      promoDiscount = p.type==='percent' ? base*(p.value/100) : Math.min(p.value, base);
      if(p.type==='percent' && p.max_discount) promoDiscount = Math.min(promoDiscount, p.max_discount);
    }
  }
  const discount_total = lineDiscount + promoDiscount;
  const total = Math.max(0, subtotal - discount_total);
  const paid_total = (draftInvoice.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  return {subtotal, discount_total, total, paid_total, promoDiscount};
}
function updateInvoiceFooter(){
  const t = computeInvoiceTotals();
  const set=(id,val)=>{ const el=document.getElementById(id); if(el) el.textContent=val; };
  set('inv-subtotal', fmtVND(t.subtotal));
  set('inv-discount', '-'+fmtVND(t.discount_total));
  set('inv-total', fmtVND(t.total));
  set('inv-paid', fmtVND(t.paid_total));
  set('inv-due', fmtVND(Math.max(0,t.total-t.paid_total)));
}
function renderInvoiceLinesTable(){
  return `<div class="table-wrap"><table><thead><tr><th>Mục</th><th class="num">SL</th><th class="num">Đơn giá</th><th class="num">Giảm giá</th><th class="num">Thành tiền</th><th></th></tr></thead><tbody id="inv-lines-body">
    ${draftInvoice.lines.map((l,idx)=>`<tr data-idx="${idx}">
      <td>${esc(l.name)}<div class="faint" style="font-size:10.5px;">${l.kind==='service'?'Dịch vụ':'Sản phẩm'}</div></td>
      <td class="num"><input type="number" min="0" step="any" style="width:70px;text-align:right;" value="${l.qty}" oninput="updateLine(${idx},'qty',this.value)"></td>
      <td class="num"><input type="number" min="0" style="width:100px;text-align:right;" value="${l.price}" oninput="updateLine(${idx},'price',this.value)"></td>
      <td class="num"><input type="number" min="0" style="width:90px;text-align:right;" value="${l.discount||0}" oninput="updateLine(${idx},'discount',this.value)"></td>
      <td class="num mono line-total">${fmtVND(l.qty*l.price-(l.discount||0))}</td>
      <td><button class="iconbtn" onclick="removeLine(${idx})">${icon('x')}</button></td>
    </tr>`).join('') || `<tr><td colspan="6" class="muted" style="text-align:center;padding:20px;">Chưa có dòng nào. Thêm dịch vụ/sản phẩm bên dưới.</td></tr>`}
  </tbody></table></div>`;
}
function updateLine(idx, field, val){
  draftInvoice.lines[idx][field] = field==='qty'||field==='price'||field==='discount' ? Number(val)||0 : val;
  const l = draftInvoice.lines[idx];
  const row = document.querySelector('#inv-lines-body tr[data-idx="'+idx+'"] .line-total');
  if(row) row.textContent = fmtVND(l.qty*l.price-(l.discount||0));
  updateInvoiceFooter();
}
function removeLine(idx){ draftInvoice.lines.splice(idx,1); refreshLinesSection(); }
function refreshLinesSection(){ const el=document.getElementById('inv-lines-section'); if(el) el.innerHTML=renderInvoiceLinesTable(); updateInvoiceFooter(); }
function addLine(){
  const sel = document.getElementById('inv-add-select');
  const [kind,refId] = sel.value.split('::');
  if(!refId) return;
  let name, price;
  if(kind==='service'){ const s=byId(state.services,refId); name=s.name; price=s.price; }
  else { const it=byId(state.items,refId); name=it.name; price=it.price||0; }
  draftInvoice.lines.push({id:uid(), kind, ref_id:refId, name, qty:1, price, discount:0});
  refreshLinesSection();
}
function renderPaymentsSection(){
  const pays = draftInvoice.payments||[];
  return `<div id="inv-payments-body">
    ${pays.length? pays.map((p,idx)=>`<div class="row between" style="padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;">
      <span>${fmtDate(p.date)} · ${p.method}${p.note?(' · '+esc(p.note)):''}</span>
      <span class="row gap-8"><b class="mono">${fmtVND(p.amount)}</b><button class="iconbtn" onclick="removePayment(${idx})">${icon('x')}</button></span>
    </div>`).join('') : `<div class="muted" style="font-size:12.5px;">Chưa có khoản thanh toán nào.</div>`}
  </div>`;
}
function removePayment(idx){ draftInvoice.payments.splice(idx,1); document.getElementById('inv-payments-body').outerHTML=renderPaymentsSection(); updateInvoiceFooter(); }
function addPayment(){
  const amount=Number(document.getElementById('pay-amount').value);
  const method=document.getElementById('pay-method').value;
  const date=document.getElementById('pay-date').value||todayISO();
  const note=document.getElementById('pay-note').value.trim();
  if(!amount||amount<=0) return toast('Nhập số tiền hợp lệ','err');
  draftInvoice.payments = draftInvoice.payments||[];
  draftInvoice.payments.push({id:uid(), amount, method, date, note});
  document.getElementById('pay-amount').value='';
  document.getElementById('pay-note').value='';
  document.getElementById('inv-payments-body').outerHTML=renderPaymentsSection();
  updateInvoiceFooter();
}
function openInvoiceModal(id, prefill){
  editingInvoiceId = id||null;
  const existing = id? byId(state.invoices,id) : null;
  draftInvoice = existing? JSON.parse(JSON.stringify(existing)) : {
    customer_id:'', staff_id:'', date:todayISO(), status:'draft', lines:[], payments:[], promo_id:'', note:'', ...(prefill||{})
  };
  if(!draftInvoice.lines) draftInvoice.lines=[];
  if(!draftInvoice.payments) draftInvoice.payments=[];
  const t = computeInvoiceTotals();
  const staffOpts = state.staff.filter(s=>s.active!==false);
  const activePromos = state.promotions.filter(p=>p.active!==false);
  openModal(`
    <div class="modal-head"><h3>${existing?('Hóa đơn '+esc(existing.code)):'Tạo hóa đơn'}</h3><div class="iconbtn" onclick="closeModal()">${icon('x')}</div></div>
    <div class="modal-body">
      <div class="form-grid mb-14">
        <div class="field"><label>Khách hàng</label><select id="inv-customer">${customerOptions(draftInvoice.customer_id)}</select></div>
        <div class="field"><label>Nhân viên phụ trách (tính hoa hồng)</label><select id="inv-staff"><option value="">— không chọn —</option>${staffOpts.map(s=>`<option value="${s.id}" ${draftInvoice.staff_id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Ngày</label><input id="inv-date" type="date" value="${draftInvoice.date}"></div>
        <div class="field"><label>Trạng thái</label><select id="inv-status">${statusOptions('invoice', draftInvoice.status)}</select></div>
      </div>
      <div class="row gap-10 mb-14">
        <select id="inv-add-select" style="flex:1;">
          <option value="">— chọn dịch vụ / sản phẩm để thêm —</option>
          <optgroup label="Dịch vụ">${state.services.filter(s=>s.active!==false).map(s=>`<option value="service::${s.id}">${esc(s.name)} — ${fmtVND(s.price)}</option>`).join('')}</optgroup>
          <optgroup label="Sản phẩm">${state.items.filter(it=>it.active!==false).map(it=>`<option value="item::${it.id}">${esc(it.name)} — ${fmtVND(it.price||0)}</option>`).join('')}</optgroup>
        </select>
        <button class="btn btn-ghost" onclick="addLine()">${icon('plus')} Thêm dòng</button>
      </div>
      <div id="inv-lines-section">${renderInvoiceLinesTable()}</div>
      <div class="form-grid" style="margin-top:14px;">
        <div class="field"><label>Khuyến mãi áp dụng</label><select id="inv-promo" onchange="draftInvoice.promo_id=this.value; updateInvoiceFooter();"><option value="">— không áp dụng —</option>${activePromos.map(p=>`<option value="${p.id}" ${draftInvoice.promo_id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="field"><label>Ghi chú</label><input id="inv-note" type="text" value="${esc(draftInvoice.note||'')}"></div>
      </div>
      <hr class="sep">
      <div class="row between" style="font-size:13px;"><span class="muted">Tạm tính</span><span id="inv-subtotal" class="mono">${fmtVND(t.subtotal)}</span></div>
      <div class="row between" style="font-size:13px;margin-top:4px;"><span class="muted">Giảm giá</span><span id="inv-discount" class="mono" style="color:var(--danger)">-${fmtVND(t.discount_total)}</span></div>
      <div class="row between" style="font-size:16px;font-weight:800;margin-top:6px;"><span>Tổng cộng</span><span id="inv-total" class="mono">${fmtVND(t.total)}</span></div>
      <hr class="sep">
      <h4 style="font-size:13.5px;margin-bottom:10px;">Thanh toán</h4>
      ${renderPaymentsSection()}
      <div class="row gap-8 wrap" style="margin-top:10px;">
        <input id="pay-amount" type="number" min="0" placeholder="Số tiền" style="width:120px;">

      </div>
      <div class="row between" style="font-size:13px;margin-top:10px;"><span class="muted">Đã thu</span><span id="inv-paid" class="mono">${fmtVND(t.paid_total)}</span></div>
      <div class="row between" style="font-size:13px;"><span class="muted">Còn lại</span><span id="inv-due" class="mono">${fmtVND(Math.max(0,t.total-t.paid_total))}</span></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Đóng</button><button class="btn btn-primary" onclick="saveInvoice()">${icon('check')} Lưu hóa đơn</button></div>

async function saveInvoice(){
  const customer_id = document.getElementById('inv-customer').value;
  if(!customer_id) return toast('Chọn khách hàng','err');
  if(draftInvoice.lines.length===0) return toast('Thêm ít nhất một dịch vụ/sản phẩm','err');
  draftInvoice.customer_id = customer_id;
  draftInvoice.customer_name = byId(state.customers,customer_id).name;
  draftInvoice.staff_id = document.getElementById('inv-staff').value;
  draftInvoice.staff_name = draftInvoice.staff_id ? byId(state.staff,draftInvoice.staff_id).name : '';
  draftInvoice.date = document.getElementById('inv-date').value;
  const newStatus = document.getElementById('inv-status').value;
  const prevStatus = editingInvoiceId ? (byId(state.invoices,editingInvoiceId)||{}).status : null;
  draftInvoice.note = document.getElementById('inv-note').value.trim();
  const t = computeInvoiceTotals();
  Object.assign(draftInvoice, t);

  try{
    // Stock side-effects on status transition
    if(newStatus==='done' && prevStatus!=='done'){
      for(const l of draftInvoice.lines){
        if(l.kind==='item'){
          const it=byId(state.items,l.ref_id);
          if(it){
            l.cost_snapshot = it.cost_avg||0;
            const newStock = (it.stock_qty||0)-l.qty;
            if(newStock<0) toast('Cảnh báo: '+it.name+' không đủ tồn kho','err');
            await db.doc('items/'+it.id).update({stock_qty:newStock, updated_at:new Date().toISOString()});
            await db.collection('stockmoves').add({item_id:it.id, item_name:it.name, type:'xuat_ban', qty:-l.qty, note:'Hóa đơn '+(draftInvoice.code||''), date:draftInvoice.date, created_by:state.user.id, created_at:new Date().toISOString()});
          }
        }
      }
    } else if(newStatus==='cancelled' && prevStatus==='done'){
      for(const l of draftInvoice.lines){
        if(l.kind==='item' && l.cost_snapshot!=null){
          const it=byId(state.items,l.ref_id);
          if(it){
            const newStock=(it.stock_qty||0)+l.qty;
            await db.doc('items/'+it.id).update({stock_qty:newStock, updated_at:new Date().toISOString()});
            await db.collection('stockmoves').add({item_id:it.id, item_name:it.name, type:'hoan_tra', qty:l.qty, note:'Hủy hóa đơn '+(draftInvoice.code||''), date:todayISO(), created_by:state.user.id, created_at:new Date().toISOString()});
          }
        }
      }
      draftInvoice.needs_refund = draftInvoice.paid_total>0;
    }
    draftInvoice.status = newStatus;
    draftInvoice.updated_at = new Date().toISOString();

    if(editingInvoiceId){
      await db.doc('invoices/'+editingInvoiceId).update(draftInvoice);
      if(draftInvoice.appt_id) await db.doc('appointments/'+draftInvoice.appt_id).update({invoice_id:editingInvoiceId}).catch(()=>{});
    } else {
      draftInvoice.code = 'HD'+Date.now().toString().slice(-8);
      draftInvoice.created_by = state.user.id;
      draftInvoice.created_at = new Date().toISOString();
      const ref = await db.collection('invoices').add(draftInvoice);
      if(draftInvoice.appt_id) await db.doc('appointments/'+draftInvoice.appt_id).update({invoice_id:ref.id}).catch(()=>{});
    }
    toast('Đã lưu hóa đơn','ok'); closeModal();
  }catch(e){ toast('Lỗi: '+e.message,'err'); }
}

/* ================= MODAL / DELETE ================= */
function openModal(html, size){
  document.getElementById('modal-inner').innerHTML = `<div class="modal${size==='wide'?' wide':''}">${html}</div>`;
  document.getElementById('modal-root').classList.add('on');
}
function closeModal(){
  document.getElementById('modal-root').classList.remove('on');
  document.getElementById('modal-inner').innerHTML='';
  draftInvoice=null; editingInvoiceId=null; draftMed=null;
}
async function delDoc(col, id){
  if(!confirm('Xóa mục này? Hành động không thể hoàn tác.')) return;
  try{ await db.doc(col+'/'+id).delete(); toast('Đã xóa','ok'); }catch(e){ toast(e.message,'err'); }
}

/* ================= DB INIT & SEED ================= */
function subscribe(key, colRef){
  colRef.onSnapshot(snap=>{
    state[key] = snap.docs.map(d=>({id:d.id, ...d.data()}));
    state.dbReady = true;
    paint();
  }, err=>{ console.error(key, err); });
}
let seeded=false;
async function seedIfEmpty(){
  if(seeded) return; seeded=true;
  setTimeout(async ()=>{
    if(state.services.length===0){
      const svcs=[
        {name:'Soi da & tư vấn', category:'Khám da liễu', price:150000, duration_min:20, active:true},
        {name:'Peel da hóa học', category:'Trị liệu chuyên sâu', price:800000, duration_min:45, active:true},
        {name:'Laser trị nám', category:'Trị liệu chuyên sâu', price:1500000, duration_min:60, active:true},
        {name:'Chăm sóc da cơ bản (Facial)', category:'Chăm sóc da', price:450000, duration_min:60, active:true},
        {name:'Triệt lông laser (1 vùng)', category:'Thẩm mỹ', price:600000, duration_min:30, active:true},
        {name:'Nặn mụn + xông hơi', category:'Chăm sóc da', price:300000, duration_min:40, active:true},
        {name:'Meso trị mụn', category:'Trị liệu chuyên sâu', price:900000, duration_min:45, active:true},
      ];
      svcs.forEach((s,i)=>{ s.code='DV'+String(i+1).padStart(4,'0'); s.created_at=new Date().toISOString(); });
      for(const s of svcs){ await db.collection('services').add(s); }
    }
    if(state.items.length===0){
      const its=[
        {name:'Kem chống nắng SPF50', category:'Mỹ phẩm bán lẻ', unit:'tuýp', price:350000, min_stock:5},
        {name:'Serum Vitamin C', category:'Mỹ phẩm bán lẻ', unit:'chai', price:550000, min_stock:5},
        {name:'Sữa rửa mặt dịu nhẹ', category:'Mỹ phẩm bán lẻ', unit:'chai', price:250000, min_stock:5},
        {name:'Gạc y tế', category:'Vật tư', unit:'hộp', price:45000, min_stock:3},
        {name:'Kim tiêm filler', category:'Vật tư', unit:'cây', price:25000, min_stock:10},
      ];
      its.forEach((it,i)=>{ it.code='SP'+String(i+1).padStart(4,'0'); it.stock_qty=0; it.cost_avg=0; it.active=true; it.created_at=new Date().toISOString(); });
      for(const it of its){ await db.collection('items').add(it); }
    }
    if(!state.settings){
      const snap = await db.doc('settings/main').get();
      if(!snap.exists) await db.doc('settings/main').set(DEFAULT_SETTINGS);
    }
  }, 800);
}

/* ================= BOOT ================= */
(async function boot(){
  document.getElementById('login-screen').style.display='flex';
  if(!FIREBASE_CONFIGURED){
    document.getElementById('login-screen').innerHTML = `
      <div class="login-card" style="max-width:560px;">
        <div class="login-brand"><div class="mark">${icon('droplet')}</div><div><div class="name">Sunny Beauty Clinic</div><div class="tag">Chưa kết nối database dùng chung</div></div></div>
        <div class="login-sub" style="line-height:1.6;">
          Trang này cần một project <b>Firebase Firestore</b> (miễn phí) để nhiều tài khoản/thiết bị cùng
          đọc-ghi chung 1 dữ liệu. Mở file <code>index.html</code> bằng trình soạn thảo code, tìm khối
          <code>firebaseConfig</code> ở đầu thẻ &lt;script&gt; và dán thông tin project Firebase của bạn vào đó,
          rồi lưu file và tải lại trang. Xem hướng dẫn chi tiết từng bước Claude đã gửi kèm file này.
        </div>
      </div>`;
    return;
  }
  try{
    firebase.initializeApp(firebaseConfig);
    await firebase.auth().signInAnonymously();
    db = firebase.firestore();
  }catch(e){
    document.getElementById('login-screen').innerHTML = `<div class="login-card"><div class="login-brand"><div class="mark">${icon('droplet')}</div><div><div class="name">Sunny Beauty Clinic</div></div></div><div class="login-sub">Không thể kết nối Firebase: ${esc(e.message)}. Kiểm tra lại firebaseConfig và Firestore Rules (xem hướng dẫn).</div></div>`;
    return;
  }
  subscribe('staff', db.collection('staff'));
  subscribe('customers', db.collection('customers'));
  subscribe('services', db.collection('services'));
  subscribe('items', db.collection('items'));
  subscribe('appointments', db.collection('appointments'));
  subscribe('invoices', db.collection('invoices'));
  subscribe('finance', db.collection('finance'));
  subscribe('promotions', db.collection('promotions'));
  subscribe('stockmoves', db.collection('stockmoves'));
  subscribe('medrecords', db.collection('medrecords'));
  db.doc('settings/main').onSnapshot(snap=>{
    state.settings = (snap && snap.exists) ? snap.data() : null;
    applyTheme((state.settings||DEFAULT_SETTINGS).theme||'sage');
    paint();
  }, err=>console.error('settings', err));
  setTimeout(seedIfEmpty, 400);
  paint();
})();
</script>
